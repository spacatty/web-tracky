name: tracky

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      AUTH_REGISTRATION: ${AUTH_REGISTRATION}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      AGENT_PUBLIC_URL: ${AGENT_PUBLIC_URL}
      MIN_CHECK_INTERVAL_SEC: ${MIN_CHECK_INTERVAL_SEC}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS}
      GEO_LOOKUP_URL: ${GEO_LOOKUP_URL}
      PACK_PATH: /packs/v1.json
      RELEASE_DIR: /var/lib/tracky/releases
    ports:
      - "${API_PORT}:8080"
    volumes:
      - ./dist/agent:/var/lib/tracky/releases
      - ./packs:/packs:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8080
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      AGENT_PUBLIC_URL: ${AGENT_PUBLIC_URL}
      AUTH_REGISTRATION: ${AUTH_REGISTRATION}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${WEB_PORT}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
